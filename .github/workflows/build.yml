on:
 workflow_dispatch:

jobs:
 abuild:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Run a multi-line script
     run: |
      mkdir build
      cd build
      cmake ..
      make
   - name: artifact
     uses: actions/upload-artifact@v4
     with:
      name: release
      path: ./build/libz.so.1.3.1
